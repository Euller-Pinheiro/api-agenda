name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos e testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      # Banco de verdade: os testes exercitam restrições, ILIKE e cascatas do
      # PostgreSQL, que um SQLite em memória não reproduziria.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agenda:agenda@localhost:5432/agenda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  imagem:
    name: Imagem Docker e Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --tag api-agenda:ci .
